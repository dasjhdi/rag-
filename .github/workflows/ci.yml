name: CI

# 目标：每次 push / PR 都自动验证"代码能跑、类型没错、能构建"。
# 后端只跑离线单测（不依赖 PostgreSQL / Redis / Milvus）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # CI 不接真实服务，只提供最小可运行的配置。
          # 注意：LLM 客户端会在「导入期」构造，缺 Key 会导致 9 个测试模块
          # 收集失败（pytest exit 2），因此这里必须给占位值——不会被真实调用。
          JWT_SECRET_KEY: ci-only-secret-do-not-use-in-production
          RATE_LIMIT_ENABLED: "false"
          HF_HUB_OFFLINE: "0"
          LLM_API_KEY: sk-ci-placeholder-not-a-real-key
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
        run: pytest -q

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Client refresh-flow test
        run: npm run test:client

      - name: Build
        run: npm run build
