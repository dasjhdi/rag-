<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badge" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F18A55"/>
      <stop offset="0.55" stop-color="#E2602C"/>
      <stop offset="1" stop-color="#C74E1F"/>
    </linearGradient>
    <linearGradient id="flame" x1="32" y1="41" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9CF6B"/>
      <stop offset="1" stop-color="#EB9C2E"/>
    </linearGradient>
  </defs>

  <!-- 徽章底：圆角方块 + 炭火橙斜向渐变 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#badge)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="white" opacity="0.05"/>

  <!-- 厨师帽：奶油色三蓬云，两侧小、中冠高，瓣沟明显 -->
  <g fill="#FFF6EC">
    <circle cx="20" cy="26" r="7"/>
    <circle cx="32" cy="18" r="10.5"/>
    <circle cx="44" cy="26" r="7"/>
    <rect x="20" y="26" width="24" height="6" rx="3"/>
  </g>
  <g stroke="#F0DCC8" stroke-width="1.8" stroke-linecap="round">
    <line x1="26" y1="18.5" x2="26" y2="28"/>
    <line x1="38" y1="18.5" x2="38" y2="28"/>
  </g>
  <!-- 帽檐 -->
  <rect x="17" y="33.5" width="30" height="6" rx="3" fill="#F2E2D0"/>

  <!-- 火苗（英雄焰）：蜂蜜金渐变 + 奶油焰心 -->
  <path fill="url(#flame)" d="M32 41.5c1.5 3.1 4.4 5.3 6.3 7.4 1.4 1.6 2.3 3.4 2.3 5.3a7.6 7.6 0 1 1-15.2 0c0-2.8 1.4-5.3 3.3-7.2 1.4-1.4 2.7-3.2 3.3-5.5z"/>
  <path fill="#FFF6EC" d="M32 52.2c1.5 1.4 2.4 2.8 2.4 4.3a2.4 2.4 0 1 1-4.8 0c0-1.5.9-2.9 2.4-4.3z"/>
</svg>
